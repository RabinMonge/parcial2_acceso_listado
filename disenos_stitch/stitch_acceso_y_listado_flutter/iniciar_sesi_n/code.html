 "label-sm": ["Inter"], "label-lg": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "body-sm": ["Inter"], "title-md": ["Inter"], "display-md": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"], "title-lg": ["Inter"], "display-sm": ["Inter"], "display-lg": ["Inter"], "title-sm": ["Inter"] }, fontSize: { "label-md": ["12px", { lineHeight: "16px", fontWeight: "500" }], "label-sm": ["11px", { lineHeight: "16px", fontWeight: "500" }], "label-lg": ["14px", { lineHeight: "20px", fontWeight: "500" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-md": ["28px", { lineHeight: "36px", fontWeight: "600" }], "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "title-md": ["16px", { lineHeight: "24px", fontWeight: "600" }], "display-md": ["45px", { lineHeight: "52px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-sm": ["24px", { lineHeight: "32px", fontWeight: "600" }], "title-lg": ["22px", { lineHeight: "28px", fontWeight: "600" }], "display-sm": ["36px", { lineHeight: "44px", fontWeight: "400" }], "display-lg": ["57px", { lineHeight: "64px", fontWeight: "400" }], "title-sm": ["14px", { lineHeight: "20px", fontWeight: "600" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen antialiased"><div class="w-full px-5 h-6 pt-safe flex items-center justify-between text-on-surface-variant font-label-sm text-label-sm select-none"><span class="font-medium tracking-tight">9:41</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[15px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div><main class="flex-1 flex flex-col relative w-full bg-surface pb-safe px-margin"><div class="flex flex-col w-full pb-6">
<!-- Subtle decorative ambient header elements -->
<div class="relative w-full flex flex-col items-center pt-2 pb-6">
<div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-secondary-fixed opacity-40 blur-3xl pointer-events-none"></div>
<div class="absolute -top-6 -left-10 w-36 h-36 rounded-full bg-primary-fixed-dim opacity-30 blur-2xl pointer-events-none"></div>
<!-- App Branding Badge with subtle animated pulse -->
<div class="relative flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container-low shadow-sm mb-4">
<img alt="Logo Acceso y Listado" class="w-5 h-5 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1Ui4KLVYsO2fqecwRdF6udCkBvE75JYT2ngEz0DJ1qCqfpflNJwcKpCkQ7qrH8_sNW295dOZpxCaetYiCCslJBoEZfhzB7-CorN1vHA_xJV0OnkMpOu3vO4xxWVpC56RRqbeZ_77xnAV656jQpjdkt78btiOvT1IXU4iqSvNYrmDZa8lC-yOq3jUpuCEY_1UTRlzGYh9KgA2rNT-2ktzfwfYNy2Y0SVyVIjCgzWBL6L7g"/>
<span class="font-label-md text-label-md text-primary font-semibold tracking-wide">Acceso &amp; Listado</span>
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span>
</div>
<!-- Hero User Avatar / Identity Badge (M3 Style) -->
<div class="relative group my-1">
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-surface-container-high via-surface-container to-surface-variant flex items-center justify-center p-1.5 shadow-sm transition-transform duration-300 active:scale-95">
<div class="w-full h-full rounded-full bg-surface-container-lowest flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5"></div>
<span class="material-symbols-outlined text-[48px] text-primary select-none transition-transform duration-300 group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
</div>
<div class="absolute bottom-0 right-0 w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[15px]">lock</span>
</div>
</div>
<!-- Welcoming Header Text -->
<div class="text-center mt-3 px-2">
<p class="font-label-lg text-label-lg text-secondary font-medium tracking-wide">Bienvenido</p>
<h1 class="font-headline-md text-headline-md text-on-surface mt-0.5 tracking-tight font-bold">Iniciar sesión</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 max-w-[260px] mx-auto leading-relaxed">
        Ingresa tus credenciales para acceder a tus listas y sincronización.
      </p>
</div>
</div>
<!-- Form Surface Container (Elevated Material 3 Card) -->
<div class="w-full bg-surface-container-lowest rounded-lg p-6 shadow-sm">
<form class="flex flex-col space-y-4" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Email Field (Flutter M3 TextFormField style) -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium flex items-center gap-1.5 pl-1" for="emailInput">
<span>Correo electrónico</span>
</label>
<div class="relative flex items-center rounded-2xl bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-md">
<div class="pl-4 pr-2 flex items-center justify-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full py-3.5 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none" id="emailInput" name="email" placeholder="usuario@ejemplo.com" required="" type="email"/>
</div>
</div>
<!-- Password Field (Flutter M3 TextFormField style) -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between px-1">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="passwordInput">Contraseña</label>
<button class="font-label-sm text-label-sm text-primary font-semibold hover:underline" type="button">¿Olvidaste tu contraseña?</button>
</div>
<div class="relative flex items-center rounded-2xl bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-md">
<div class="pl-4 pr-2 flex items-center justify-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full py-3.5 pr-2 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none" id="passwordInput" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar u ocultar contraseña" class="pr-4 pl-2 py-3 text-outline-variant hover:text-on-surface-variant transition-colors flex items-center justify-center" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember device toggle -->
<div class="flex items-center justify-between pt-1 pb-1 px-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary focus:ring-0 accent-primary cursor-pointer" id="rememberMe" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Recordar sesión</span>
</label>
<span class="font-label-sm text-label-sm text-secondary font-medium flex items-center gap-1 bg-secondary-fixed/50 px-2 py-0.5 rounded-full">
<span class="material-symbols-outlined text-[12px]">verified_user</span> Seguro
        </span>
</div>
<!-- Primary Action Button (Flutter ElevatedButton StadiumBorder style) -->
<button class="w-full h-12 mt-2 rounded-full bg-primary-container text-on-primary font-title-sm text-title-sm font-semibold tracking-wide shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer" id="submitBtn" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
<!-- Biometric Fast Login Delight -->
<div class="pt-2 flex items-center justify-center">
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container text-primary font-label-md text-label-md font-medium hover:bg-surface-variant transition-colors" onclick="triggerBiometric()" type="button">
<span class="material-symbols-outlined text-[18px]">fingerprint</span>
<span>Acceder con huella o Face ID</span>
</button>
</div>
</form>
</div>
<!-- Social / Alternative Mini Tray -->
<div class="mt-6 flex flex-col items-center space-y-4">
<div class="flex items-center w-full px-4 gap-3">
<div class="h-px bg-outline-variant/40 flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">o continúa con</span>
<div class="h-px bg-outline-variant/40 flex-1"></div>
</div>
<div class="flex items-center gap-4">
<button aria-label="Continuar con Google" class="w-12 h-12 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center shadow-sm hover:shadow transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px] text-primary">public</span>
</button>
<button aria-label="Continuar con Llave de Acceso" class="w-12 h-12 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center shadow-sm hover:shadow transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px] text-secondary">vpn_key</span>
</button>
<button aria-label="Continuar como invitado" class="w-12 h-12 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center shadow-sm hover:shadow transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px] text-tertiary">badge</span>
</button>
</div>
<!-- Registration Link Footer -->
<div class="pt-2 pb-3 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        ¿No tienes cuenta?
        <a class="font-title-sm text-title-sm text-primary font-semibold ml-1 hover:underline inline-flex items-center gap-0.5" href="#register">
          Regístrate
        </a>
</p>
</div>
</div>
<!-- Interactive feedback toast snackbar container (Hidden by default) -->
<div class="fixed bottom-6 left-4 right-4 max-w-sm mx-auto bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-full shadow-lg font-label-md text-label-md flex items-center justify-between opacity-0 pointer-events-none transition-opacity duration-300 z-50" id="statusToast">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary-fixed" id="toastIcon">check_circle</span>
<span id="toastMsg">Iniciando sesión...</span>
</div>
<span class="material-symbols-outlined text-[16px] opacity-60">close</span>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.innerText = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.innerText = 'visibility';
    }
  }

  function showToast(msg, icon = 'info') {
    const toast = document.getElementById('statusToast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');
    if (!toast || !toastMsg || !toastIcon) return;

    toastMsg.innerText = msg;
    toastIcon.innerText = icon;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');

    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2800);
  }

  function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    if (btn) {
      btn.classList.add('opacity-80');
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Verificando...</span>`;
      setTimeout(() => {
        btn.classList.remove('opacity-80');
        btn.innerHTML = `<span>Iniciar sesión</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>`;
        showToast('Credenciales verificadas con éxito', 'verified');
      }, 1200);
    }
  }

  function triggerBiometric() {
    showToast('Escaneando biométricos autorizados...', 'fingerprint');
  }
</script></main></body></html>
